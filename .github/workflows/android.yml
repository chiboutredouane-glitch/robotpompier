name: iOS Télécommande universelle
run-name: iPhone 1.0.3 · ${{ github.ref_name }}
on:
  push:
    branches: [telecommande-universelle-ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Vérifier Xcode et le projet
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/project.py
          plutil -lint App/Info.plist TelecommandeUniverselle.xcodeproj/project.pbxproj
          xcodebuild -list -project TelecommandeUniverselle.xcodeproj
      - name: Tester les commandes et les files d’écriture
        run: swift test
      - name: Choisir un simulateur iPhone
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/ios-devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/ios-devices.json'))
          devices=[x for group in d['devices'].values() for x in group if x['name'].startswith('iPhone') and x.get('isAvailable')]
          if not devices: raise SystemExit('Aucun simulateur iPhone disponible')
          print('IOS_SIMULATOR_ID='+devices[0]['udid'])
          PY
      - name: Démarrer le simulateur iPhone
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Compiler et tester l’interface iOS
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p build dist
          xcodebuild -project TelecommandeUniverselle.xcodeproj -scheme TelecommandeUniverselle -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 CODE_SIGNING_ALLOWED=NO test | tee build/simulator.log
      - name: Extraire l’aperçu simulé
        run: xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/previews
      - name: Compiler l’application pour iPhone physique sans signature
        run: |
          set -euo pipefail
          xcodebuild -project TelecommandeUniverselle.xcodeproj -scheme TelecommandeUniverselle -configuration Release -destination 'generic/platform=iOS' -archivePath build/TelecommandeUniverselle.xcarchive CODE_SIGNING_ALLOWED=NO archive | tee build/archive.log
          mkdir -p dist/Payload
          cp -R build/TelecommandeUniverselle.xcarchive/Products/Applications/TelecommandeUniverselle.app dist/Payload/
          test -f dist/Payload/TelecommandeUniverselle.app/TelecommandeUniverselle
          lipo -info dist/Payload/TelecommandeUniverselle.app/TelecommandeUniverselle
          cd dist
          zip -qry TelecommandeUniverselle-1.0.3-non-signee.ipa Payload
          shasum -a 256 TelecommandeUniverselle-1.0.3-non-signee.ipa > SHA256SUMS.txt
          rm -rf Payload
      - name: Publier le fichier à signer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TelecommandeUniverselle-iOS-NON-SIGNEE
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            INSTALLATION.md
          if-no-files-found: error
          retention-days: 30
      - name: Publier les vérifications
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TelecommandeUniverselle-iOS-verifications
          path: |
            build/*.log
            build/*.xcresult
            build/previews/
          if-no-files-found: warn
          retention-days: 30
