name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et publier l’APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties

      - name: Installer les outils Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Installer le SDK du projet
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Vérifier les fichiers Gradle
        shell: bash
        run: |
          set -euo pipefail
          for file in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts; do
            test -s "$file"
          done
          test -x gradlew

      - name: Compiler, tester et analyser
        run: ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug

      - name: Préparer et vérifier l’APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RobotPompier-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/RobotPompier-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 dist/RobotPompier-debug.apk
          cd dist
          sha256sum RobotPompier-debug.apk > SHA256SUMS.txt

      - name: Publier l’APK téléchargeable
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RobotPompier-debug
          path: |
            dist/RobotPompier-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Afficher le lien de téléchargement
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## APK prêt à télécharger
          [Télécharger RobotPompier-debug.zip](${{ steps.apk.outputs.artifact-url }})

          Connectez-vous à GitHub, téléchargez cet artefact puis extrayez le ZIP.
          Le fichier à installer sur Android est **RobotPompier-debug.apk**.
          Aucun Android Studio n’est nécessaire pour télécharger ou installer l’APK.
          L’artefact reste disponible pendant 30 jours ; relancez le workflow pour le régénérer.
          EOF
